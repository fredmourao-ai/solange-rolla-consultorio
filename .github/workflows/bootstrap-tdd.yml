name: Bootstrap TDD

on:
  push:
    branches:
      - feat/1-foundation-platform

permissions:
  contents: read

jobs:
  task-3-red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Require explicit Supabase project config
        run: test -f supabase/config.toml

      - name: Verify Docker
        run: docker version

      - name: Start Supabase local stack
        run: npx supabase@2.115.0 start

      - name: Run database smoke test
        run: npx supabase@2.115.0 test db
