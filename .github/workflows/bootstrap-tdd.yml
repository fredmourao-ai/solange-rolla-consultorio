name: Bootstrap TDD

on:
  push:
    branches:
      - feat/1-foundation-platform

permissions:
  contents: read

jobs:
  task-3-head-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Verify runtime
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Verify lockfile is reproducible
        run: git diff --exit-code -- package-lock.json

      - name: Verify current Supabase API-key contract
        run: npm test -- src/platform/env/schema.test.ts --run

      - name: Require explicit Supabase project config
        run: test -f supabase/config.toml

      - name: Start local Postgres only
        run: npx supabase@2.115.0 db start

      - name: Rebuild database from migrations and seed
        run: npx supabase@2.115.0 db reset

      - name: Run database smoke test
        run: npx supabase@2.115.0 test db

      - name: Verify generated database types are current
        run: |
          npx supabase@2.115.0 gen types typescript --local > /tmp/database-types.ts
          diff -u src/platform/supabase/types.ts /tmp/database-types.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high
