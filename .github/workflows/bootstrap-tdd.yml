name: Bootstrap TDD

on:
  push:
    branches:
      - feat/1-foundation-platform

permissions:
  contents: read

jobs:
  task-1-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Verify runtime
        run: |
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Verify lockfile is reproducible
        run: git diff --exit-code -- package-lock.json

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Capture generated Next metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-generated-${{ github.sha }}
          path: |
            next-env.d.ts
            tsconfig.json
          if-no-files-found: warn
