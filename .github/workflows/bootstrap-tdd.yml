name: Bootstrap TDD

on:
  push:
    branches:
      - feat/1-foundation-platform

permissions:
  contents: read

jobs:
  task-2-red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install dependencies and refresh candidate lockfile
        run: npm install --ignore-scripts

      - name: Run environment contract test
        run: npm test -- src/platform/env/schema.test.ts --run

      - name: Capture candidate lockfile and audit
        if: always()
        run: npm audit --json > npm-audit.json || true

      - name: Preserve Task 2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task2-red-${{ github.sha }}
          path: |
            package-lock.json
            npm-audit.json
          if-no-files-found: error
