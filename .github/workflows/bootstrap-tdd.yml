name: Bootstrap TDD

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  result-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Verify runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies and generate lockfile
        run: npm install --ignore-scripts

      - name: Run Result contract test
        run: npm test -- src/shared/kernel/result.test.ts --run

      - name: Preserve generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
