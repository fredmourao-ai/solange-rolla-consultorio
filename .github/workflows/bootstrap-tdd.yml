name: Bootstrap TDD

on:
  push:
    branches:
      - feat/1-foundation-platform

permissions:
  contents: read

jobs:
  result-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Verify runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies and generate lockfile
        run: npm install --ignore-scripts

      - name: Run Result contract test
        run: npm test -- src/shared/kernel/result.test.ts --run

      - name: Capture dependency audit
        if: always()
        run: npm audit --json > npm-audit.json || true

      - name: Preserve bootstrap artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ github.sha }}
          path: |
            package-lock.json
            npm-audit.json
          if-no-files-found: error
