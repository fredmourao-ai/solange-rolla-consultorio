name: Bootstrap TDD

on:
  push:
    branches:
      - feat/1-foundation-platform

permissions:
  contents: write

jobs:
  task-2-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install dependencies and refresh lockfile
        run: npm install --ignore-scripts

      - name: Persist lockfile if changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock typed environment dependency [skip ci]"
            git push origin HEAD:feat/1-foundation-platform
          fi

      - name: Verify environment tests
        run: npm test -- src/platform/env/schema.test.ts --run

      - name: Dependency audit
        run: npm audit --audit-level=high
