name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, solange-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, solange-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck

  unit:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, solange-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:run

  architecture:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, solange-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Architecture dependency contracts
        run: npm run arch:check
      - name: Module contracts
        run: npm run modules:check
      - name: Environment isolation assertion
        env:
          APP_ENV: local
          WHATSAPP_LIVE_ENABLED: false
          EMAIL_LIVE_ENABLED: false
          NFSE_LIVE_ENABLED: false
        run: npm run environment:check

  build:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, solange-ci]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify lockfile is reproducible
        run: git diff --exit-code -- package-lock.json
      - name: Architecture dependency contracts
        run: npm run arch:check
      - name: Module contracts
        run: npm run modules:check
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  e2e:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, solange-ci]
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Start and reset isolated local Supabase
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/supabase-start.log" "$RUNNER_TEMP/supabase-start-retry.log"' EXIT
          if docker ps -a --format '{{.Names}}' | grep -q '_solange-rolla-consultorio$'; then
            npx supabase@2.115.0 stop --no-backup
          else
            echo "No local Supabase stack to stop."
          fi
          if ! npx supabase@2.115.0 start >"$RUNNER_TEMP/supabase-start.log" 2>&1; then
            echo "::warning::Local Supabase failed initial health check; retrying once after cleanup."
            npx supabase@2.115.0 stop --no-backup || true
            sleep 5
            npx supabase@2.115.0 start >"$RUNNER_TEMP/supabase-start-retry.log" 2>&1
          fi
          npx supabase@2.115.0 db reset
          rm -f "$RUNNER_TEMP/supabase-start.log" "$RUNNER_TEMP/supabase-start-retry.log"
          trap - EXIT
      - name: Prepare local E2E environment
        shell: bash
        run: |
          set -euo pipefail
          while IFS='=' read -r key value; do
            case "$key" in
              API_URL|DB_URL|PUBLISHABLE_KEY|SECRET_KEY)
                value="${value#\"}"
                value="${value%\"}"
                printf -v "$key" '%s' "$value"
                export "$key"
                ;;
            esac
          done < <(npx supabase@2.115.0 status -o env)
          test -n "$API_URL" && test -n "$DB_URL" && test -n "$PUBLISHABLE_KEY" && test -n "$SECRET_KEY"
          {
            echo "DB_URL=$DB_URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "APP_URL=http://127.0.0.1:3000"
            echo "APP_ENV=local"
            echo "NEXT_PUBLIC_TEMP_ADMIN_LOGIN_ENABLED=true"
            echo "WHATSAPP_LIVE_ENABLED=false"
            echo "EMAIL_LIVE_ENABLED=false"
            echo "NFSE_LIVE_ENABLED=false"
            echo "CLINICAL_ENCRYPTION_ACTIVE_VERSION=1"
            echo "CLINICAL_ENCRYPTION_KEY_V1=$(printf 'solange-ci-local-e2e-key-0000001' | base64 -w0)"
            echo "RATE_LIMIT_HMAC_KEY=solange-ci-local-rate-limit-key-32-bytes"
            echo "PUBLIC_ACTION_HMAC_KEY=solange-ci-local-public-action-key-32-bytes"
            echo "DEMO_LOCAL_EMAIL=demo.owner@solange.invalid"
            echo "DEMO_LOCAL_PASSWORD=DemoLocalOnly!2026"
          } >> "$GITHUB_ENV"
      - name: Build application
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/solange-e2e-server.log"
          E2E_SERVER_PID=''
          cleanup_server() {
            if [ -n "$E2E_SERVER_PID" ] && kill -0 "$E2E_SERVER_PID" 2>/dev/null; then
              kill -TERM -- "-$E2E_SERVER_PID" 2>/dev/null || true
              wait "$E2E_SERVER_PID" 2>/dev/null || true
            fi
          }
          trap cleanup_server EXIT
          started=false
          for attempt in 1 2 3 4 5; do
            E2E_PORT="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
            test -n "$E2E_PORT"
            export E2E_PORT
            export APP_URL="http://127.0.0.1:$E2E_PORT"
            : > "$LOG"
            setsid npm run start -- --hostname 127.0.0.1 --port "$E2E_PORT" >"$LOG" 2>&1 &
            E2E_SERVER_PID=$!
            for _ in $(seq 1 60); do
              if curl -fsS "$APP_URL/api/health" >/dev/null 2>&1; then
                started=true
                break
              fi
              if ! kill -0 "$E2E_SERVER_PID" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            if [ "$started" = true ]; then
              break
            fi
            cleanup_server
            E2E_SERVER_PID=''
            sleep 1
          done
          if [ "$started" != true ]; then
            cat "$LOG" >&2 || true
            exit 1
          fi
          export E2E_REUSE_EXISTING_SERVER=true
          npm run test:e2e

      - name: Stop isolated local Supabase
        if: always()
        run: npx supabase@2.115.0 stop --no-backup
