name: Database

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: db-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  db:
    concurrency:
      group: solange-local-supabase
      cancel-in-progress: false
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, solange-ci]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Isolate npm cache per runner
        shell: bash
        run: echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"

      - name: Use Node 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify lockfile is reproducible
        run: git diff --exit-code -- package-lock.json

      - name: Require explicit Supabase project config
        run: test -f supabase/config.toml

      - name: Verify synthetic seed
        run: npm run seed:check

      - name: Migration history
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run migrations:check

      - name: Start local database
        run: npx supabase@2.118.0 db start

      - name: Rebuild database from migrations and seed
        run: npx supabase@2.118.0 db reset

      - name: Run pgTAP database tests
        run: npx supabase@2.118.0 test db

      - name: Ensure postgres-meta image for type verification
        run: |
          image="public.ecr.aws/supabase/postgres-meta:v0.98.0"
          delay=5
          for attempt in 1 2 3 4 5; do
            if docker image inspect "$image" >/dev/null 2>&1 || docker pull "$image"; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep "$delay"
            delay=$((delay * 2))
          done

      - name: Verify generated database types are current
        run: |
          npx supabase@2.118.0 gen types typescript --local > /tmp/database-types.ts
          diff -u src/platform/supabase/types.ts /tmp/database-types.ts
