name: Diagnostic - Staging Host Inspect

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Linux, ARM64, solange-ci, solange-staging-host]
    timeout-minutes: 5
    steps:
      - name: Inspect staging deploy root (read-only)
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/home/ubuntu/solange-client-demo
          echo "--- ls ROOT ---"
          ls -la "$ROOT" 2>&1
          echo "--- ls ROOT/app (top level) ---"
          ls -la "$ROOT/app" 2>&1 | head -40
          echo "--- ROOT/app owner sample ---"
          find "$ROOT/app" -maxdepth 1 -not -user "$(id -un)" 2>&1 | head -20
          echo "--- package.json present? ---"
          test -f "$ROOT/app/package.json" && echo "package.json EXISTS" || echo "package.json MISSING"
          echo "--- src dir present? ---"
          test -d "$ROOT/app/src" && echo "src EXISTS" || echo "src MISSING"
          echo "--- docker ps ---"
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}' 2>&1
          echo "--- state dir ---"
          ls -la "$ROOT/state" 2>&1
          cat "$ROOT/state/deployed-sha.txt" 2>&1 || echo "no deployed-sha.txt"
          echo "--- health check via container ---"
          STAGING_PORT=3200
          curl -fsS --max-time 5 "http://127.0.0.1:$STAGING_PORT/api/health" | tee /tmp/solange-staging-health.json
          test "$(jq -r '.status // empty' /tmp/solange-staging-health.json)" = ok
          echo "--- root-owned file count in app ---"
          find "$ROOT/app" -not -user "$(id -un)" 2>/dev/null | wc -l || true
          find "$ROOT/app-previous" -not -user "$(id -un)" 2>/dev/null | wc -l || true
          echo "--- passwordless sudo available? ---"
          sudo -n true 2>&1 && echo "SUDO_NOPASSWD_AVAILABLE" || echo "SUDO_NOPASSWD_UNAVAILABLE"
          echo "--- disk space ---"
          df -h "$ROOT"
          DISK_USED=$(df -P "$ROOT" | awk 'NR==2 {gsub(/%/,"",$5); print $5}')
          echo "disk_used_percent=$DISK_USED"
          test "$DISK_USED" -lt 95 || { echo "disk usage critical: $DISK_USED%" >&2; exit 1; }
          echo "--- web container status and crash logs ---"
          docker inspect solange-client-demo-web --format '{{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' 2>&1 || true
          docker logs --tail 80 solange-client-demo-web 2>&1 || true
          echo "--- backup destination and scheduler health ---"
          BACKUP_DEST=/home/ubuntu/solange-client-demo/backups
          ls -la "$BACKUP_DEST" 2>&1 || true
          test -w "$BACKUP_DEST" 2>&1 && echo "WRITABLE" || echo "NOT_WRITABLE_OR_MISSING"
          cat "$BACKUP_DEST/LAST_SUCCESS" 2>&1 || echo "NO_LAST_SUCCESS"
          docker inspect solange-backup-scheduler --format 'status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' 2>&1 || true
