name: Historical State Audit

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full deployed staging SHA to audit
        required: true
        type: string
  workflow_run:
    workflows: [Staging Promote]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-state-audit-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'automatic' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

jobs:
  eligibility:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, Linux, ARM64, solange-ci, solange-staging-host]
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.upstream.outputs.ready }}
      expected_sha: ${{ steps.upstream.outputs.expected_sha }}
    env:
      UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
      EVENT_NAME: ${{ github.event_name }}
      EXPECTED_SHA_INPUT: ${{ inputs.expected_sha }}
      WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Verify upstream promotion actually deployed
        id: upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const repo = process.env.GITHUB_REPOSITORY
          const runId = process.env.UPSTREAM_RUN_ID
          const token = process.env.GITHUB_TOKEN
          const eventName = process.env.EVENT_NAME
          const expectedShaInput = process.env.EXPECTED_SHA_INPUT
          const workflowRunSha = process.env.WORKFLOW_RUN_SHA
          const output = process.env.GITHUB_OUTPUT
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
          }
          async function main() {
            if (eventName === 'workflow_dispatch') {
              if (!/^[0-9a-f]{40}$/i.test(expectedShaInput)) throw new Error('EXPECTED_SHA_INVALID')
              fs.appendFileSync(output, `ready=true\nexpected_sha=${expectedShaInput}\n`)
              console.log(`manual historical audit requested for ${expectedShaInput}`)
              return
            }
            const response = await fetch(`https://api.github.com/repos/${repo}/actions/runs/${runId}/jobs?per_page=100`, { headers })
            if (!response.ok) throw new Error(`GitHub API ${response.status}`)
            const payload = await response.json()
            const promote = payload.jobs.find((job) => job.name === 'promote')
            const ready = promote?.status === 'completed' && promote?.conclusion === 'success'
            fs.appendFileSync(output, `ready=${ready}\nexpected_sha=${workflowRunSha}\n`)
            console.log(ready ? 'upstream promote job succeeded' : `audit skipped: promote=${promote?.status ?? 'missing'}/${promote?.conclusion ?? 'none'}`)
          }
          main().catch((error) => { console.error(error); process.exit(1) })
          NODE

  audit:
    needs: eligibility
    if: needs.eligibility.outputs.ready == 'true'
    runs-on: [self-hosted, Linux, ARM64, solange-ci, solange-staging-host]
    environment: staging
    timeout-minutes: 60
    env:
      EXPECTED_SHA: ${{ needs.eligibility.outputs.expected_sha }}
      STAGING_DEPLOY_ROOT: /home/ubuntu/solange-client-demo
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
    steps:
      - name: Checkout audited revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Verify exact deployed SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat "$STAGING_DEPLOY_ROOT/state/deployed-sha.txt")" = "$EXPECTED_SHA"
          URL=$(cat "$STAGING_DEPLOY_ROOT/state/current-url.txt")
          payload=$(curl --fail --silent --show-error --retry 3 "$URL/api/health")
          test "$(printf '%s' "$payload" | jq -r '.buildSha')" = "$EXPECTED_SHA"

      - name: Isolate npm cache per runner
        shell: bash
        run: echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"

      - name: Use Node 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Audit historical state transitions through published UI
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$STAGING_DEPLOY_ROOT/staging.env" "$STAGING_DEPLOY_ROOT/state/current-url.txt" "$EXPECTED_SHA" <<'PY'
          import os, pathlib, subprocess, sys
          values = {}
          for raw in pathlib.Path(sys.argv[1]).read_text().splitlines():
              if raw and not raw.startswith('#') and '=' in raw:
                  key, value = raw.split('=', 1)
                  values[key] = value
          app_url = pathlib.Path(sys.argv[2]).read_text().strip().rstrip('/')
          expected_sha = sys.argv[3]
          child = os.environ.copy()
          child.update(values)
          child.update({
              'APP_ENV': 'staging',
              'E2E_TARGET_ENV': 'staging',
              'APP_URL': app_url,
              'E2E_BASE_URL': app_url,
              'E2E_ALLOWED_BASE_URL': app_url,
              'E2E_DB_MODE': 'supabase-management-api',
              'E2E_EXTERNAL_SUITE': 'historical-state-audit',
              'SUPABASE_STAGING_PROJECT_REF': os.environ['SUPABASE_STAGING_PROJECT_REF'],
              'SUPABASE_ACCESS_TOKEN': os.environ['SUPABASE_ACCESS_TOKEN'],
              'E2E_EXPECTED_BUILD_SHA': expected_sha,
          })
          subprocess.run([
              'npx', 'playwright', 'test',
              'tests/e2e/agenda-historical-state-transitions.spec.ts',
              '--project=chromium', '--workers=1',
          ], env=child, check=True)
          PY
      - name: Audit full runtime parity through published UI
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$STAGING_DEPLOY_ROOT/staging.env" "$STAGING_DEPLOY_ROOT/state/current-url.txt" "$EXPECTED_SHA" <<'PY'
          import os, pathlib, subprocess, sys
          values = {}
          for raw in pathlib.Path(sys.argv[1]).read_text().splitlines():
              if raw and not raw.startswith('#') and '=' in raw:
                  key, value = raw.split('=', 1)
                  values[key] = value
          app_url = pathlib.Path(sys.argv[2]).read_text().strip().rstrip('/')
          expected_sha = sys.argv[3]
          child = os.environ.copy()
          child.update(values)
          child.update({
              'APP_ENV': 'staging',
              'E2E_TARGET_ENV': 'staging',
              'APP_URL': app_url,
              'E2E_BASE_URL': app_url,
              'E2E_ALLOWED_BASE_URL': app_url,
              'E2E_DB_MODE': 'supabase-management-api',
              'E2E_EXTERNAL_SUITE': 'full-runtime-parity',
              'SUPABASE_STAGING_PROJECT_REF': os.environ['SUPABASE_STAGING_PROJECT_REF'],
              'SUPABASE_ACCESS_TOKEN': os.environ['SUPABASE_ACCESS_TOKEN'],
              'E2E_EXPECTED_BUILD_SHA': expected_sha,
          })
          subprocess.run([
              'npx', 'playwright', 'test',
              '--project=chromium', '--workers=1',
          ], env=child, check=True)
          PY
