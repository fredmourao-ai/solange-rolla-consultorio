name: Ops Prune Stale Action Queue
on:
  push:
    branches:
      - ops/prune-stale-action-queue-20260919
permissions:
  actions: write
  contents: read
  pull-requests: read
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel only superseded or closed-PR queued runs
        shell: bash
        run: |
          set -Eeuo pipefail
          repo="$GITHUB_REPOSITORY"
          tmp="$(mktemp)"
          gh api "repos/$repo/actions/runs?status=queued&per_page=100" > "$tmp"
          jq -c '.workflow_runs[] | select(.event=="pull_request") | {id,name,head_branch,head_sha,prs:(.pull_requests // [])}' "$tmp" |
          while IFS= read -r row; do
            id="$(jq -r '.id' <<<"$row")"
            name="$(jq -r '.name' <<<"$row")"
            branch="$(jq -r '.head_branch' <<<"$row")"
            run_sha="$(jq -r '.head_sha' <<<"$row")"
            pr="$(jq -r '.prs[0].number // empty' <<<"$row")"

            if [ -n "$pr" ]; then
              pr_json="$(gh api "repos/$repo/pulls/$pr")"
              state="$(jq -r '.state' <<<"$pr_json")"
              current_sha="$(jq -r '.head.sha' <<<"$pr_json")"
              if [ "$state" != "open" ] || [ "$run_sha" != "$current_sha" ]; then
                echo "CANCEL id=$id name=$name pr=$pr reason=superseded_or_closed"
                gh api -X POST "repos/$repo/actions/runs/$id/cancel" >/dev/null || true
              fi
              continue
            fi

            open_count="$(gh api "repos/$repo/pulls?state=open&head=fredmourao-ai:$branch&per_page=10" --jq 'length')"
            if [ "$open_count" = "0" ]; then
              echo "CANCEL id=$id name=$name branch=$branch reason=no_open_pr"
              gh api -X POST "repos/$repo/actions/runs/$id/cancel" >/dev/null || true
            fi
          done
