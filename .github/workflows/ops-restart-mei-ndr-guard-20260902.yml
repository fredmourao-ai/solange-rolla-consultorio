name: One-shot MEI NDR Guard restart

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ops-restart-mei-ndr-guard-20260902.yml

permissions:
  contents: read

jobs:
  restart-ndr-guard:
    runs-on: [self-hosted, Linux, ARM64, solange-ci]
    timeout-minutes: 10
    steps:
      - name: Restart and verify MEI NDR Guard
        shell: bash
        run: |
          set -euo pipefail

          expected_host='always-free-arm-1787907847-26'
          expected_commit='1d0721460b982c756d35ed9f32f67975d53768d1'
          service='mei-mg-email-ndr-guard.service'
          worker='mei-mg-email-worker.service'
          repo='/home/ubuntu/mei-mg-email'

          actual_host="$(hostname)"
          test "$actual_host" = "$expected_host"

          old_pid="$(systemctl show -p MainPID --value "$service")"
          test "$old_pid" -gt 1
          test "$(systemctl is-active "$service")" = active
          test "$(systemctl is-active "$worker")" = active

          cd "$repo"
          test "$(git rev-parse HEAD)" = "$expected_commit"
          test -z "$(git status --porcelain)"

          sudo -n systemctl restart "$service"

          new_pid='0'
          for _ in $(seq 1 30); do
            sleep 1
            new_pid="$(systemctl show -p MainPID --value "$service")"
            if [ "$(systemctl is-active "$service")" = active ] && [ "$new_pid" -gt 1 ] && [ "$new_pid" != "$old_pid" ]; then
              break
            fi
          done

          test "$new_pid" -gt 1
          test "$new_pid" != "$old_pid"
          test "$(systemctl is-active "$service")" = active
          test "$(systemctl is-active "$worker")" = active

          echo "OLD_PID=$old_pid"
          echo "NEW_PID=$new_pid"
          echo "ACTIVE_ENTER=$(systemctl show -p ActiveEnterTimestamp --value "$service")"
          journalctl -u "$service" -n 40 --no-pager
