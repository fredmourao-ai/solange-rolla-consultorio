name: PR Auto Merge

on:
  workflow_run:
    workflows:
      - CI
      - Database
      - Repository Governance Gate
      - AI Conflict Resolver
      - Preview
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read
  statuses: read

concurrency:
  group: pr-auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge-if-green:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'skipped')
    runs-on: [self-hosted, Linux, ARM64, solange-ci]
    timeout-minutes: 10
    steps:
      - name: Bootstrap verified GitHub CLI
        env:
          GH_VERSION: 2.98.0
          GH_SHA256: cf689084f3a3618f7eae4a2420d335d74626d65f5e594b9828d125d69f800d86
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/gh_${GH_VERSION}_linux_arm64.tar.gz"
          curl -fsSL --retry 3 "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_arm64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$GH_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${GH_VERSION}_linux_arm64/bin" >> "$GITHUB_PATH"

      - name: Resolve eligible same-repository PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          pulls="$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls")"
          pr_json="$(jq --arg sha "$HEAD_SHA" '[.[] | select(.state == "open") | select(.head.repo.full_name == .base.repo.full_name) | select(.base.ref == "main") | select(.head.sha == $sha)][0]' <<<"$pulls")"
          if [ "$pr_json" = "null" ]; then
            merged_json="$(jq --arg sha "$HEAD_SHA" '[.[] | select(.merged_at != null) | select(.head.repo.full_name == .base.repo.full_name) | select(.base.ref == "main") | select(.head.sha == $sha)][0]' <<<"$pulls")"
            if [ "$merged_json" != "null" ]; then
              merged_main_sha="$(jq -r '.merge_commit_sha // empty' <<<"$merged_json")"
              if [ -n "$merged_main_sha" ]; then
                echo "merged_main_sha=$merged_main_sha" >> "$GITHUB_OUTPUT"
                echo "Exact PR head was already merged as main@$merged_main_sha."
              fi
            else
              echo 'No eligible same-repository PR for this exact head SHA.'
            fi
            exit 0
          fi
          pr_number="$(jq -r '.number' <<<"$pr_json")"

          required=('CI' 'Database' 'Repository Governance Gate' 'AI Conflict Resolver' 'Preview')
          required_json="$(printf '%s\n' "${required[@]}" | jq -R . | jq -s .)"
          workflow_runs="$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100")"
          if ! jq -e --argjson required "$required_json" '
            . as $root |
            all($required[];
              . as $name |
              ($root.workflow_runs | map(select(.name == $name)) | sort_by(.created_at) | last) as $run |
              ($run != null) and
              ($run.status == "completed") and
              (if $name == "Preview"
               then ($run.conclusion == "success" or $run.conclusion == "skipped")
               else $run.conclusion == "success"
               end)
            )
          ' <<<"$workflow_runs" >/dev/null; then
            echo 'Canonical pull-request workflows are not all complete and green yet.'
            exit 0
          fi

          checks="$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?filter=latest&per_page=100")"
          if ! jq -e '
            (.total_count > 0) and
            all(.check_runs[];
              .status == "completed" and
              (.conclusion == "success" or .conclusion == "skipped" or .conclusion == "neutral")
            )
          ' <<<"$checks" >/dev/null; then
            echo 'Check runs are not all complete and green yet.'
            exit 0
          fi

          statuses="$(gh api "repos/$REPO/commits/$HEAD_SHA/status")"
          if ! jq -e '(.statuses | length == 0) or .state == "success"' <<<"$statuses" >/dev/null; then
            echo 'Legacy commit statuses are not green.'
            exit 0
          fi

          current_pr="$(gh api "repos/$REPO/pulls/$pr_number")"
          jq -e --arg sha "$HEAD_SHA" '
            .state == "open" and
            .base.ref == "main" and
            .head.sha == $sha and
            .head.repo.full_name == .base.repo.full_name
          ' <<<"$current_pr" >/dev/null

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Merge validated PR
        if: steps.pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA"

      - name: Re-validate merged main at its exact SHA
        # The squash merge above is pushed with GITHUB_TOKEN, which GitHub
        # does not treat as a `push` event trigger. Without this step,
        # ci.yml/db.yml/repository-governance.yml's `push` triggers never
        # fire for the resulting main commit, so it can never accumulate the
        # push-gated check runs that staging-promote.yml requires before it
        # will deploy an exact SHA. Re-dispatch those three workflows against
        # the new main tip so the commit gets validated in its final,
        # merged form instead of only as a pre-merge PR head.
        if: steps.pr.outputs.pr_number != '' || steps.pr.outputs.merged_main_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sha="${{ steps.pr.outputs.merged_main_sha }}"
          [ -n "$sha" ] || sha="$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)"
          current_main="$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)"
          if [ "$current_main" != "$sha" ]; then
            echo "Main advanced to $current_main; refusing to revalidate stale merge $sha."
            exit 0
          fi
          existing="$(gh api "repos/$REPO/actions/runs?head_sha=$sha&event=workflow_dispatch&per_page=100")"
          echo "Ensuring post-merge validation for main@$sha"
          for workflow in ci.yml db.yml repository-governance.yml; do
            path=".github/workflows/$workflow"
            if jq -e --arg path "$path" '.workflow_runs[] | select(.path == $path)' <<<"$existing" >/dev/null; then
              echo "Skipping already-dispatched $workflow for main@$sha"
              continue
            fi
            gh api --method POST "repos/$REPO/actions/workflows/$workflow/dispatches" -f ref=main
          done
