name: PR Auto Merge

on:
  workflow_run:
    workflows:
      - CI
      - Database
      - Repository Governance Gate
      - AI Conflict Resolver
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: pr-auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge-if-green:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Linux, ARM64, solange-ci]
    timeout-minutes: 10
    steps:
      - name: Bootstrap verified GitHub CLI
        env:
          GH_VERSION: 2.98.0
          GH_SHA256: cf689084f3a3618f7eae4a2420d335d74626d65f5e594b9828d125d69f800d86
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/gh_${GH_VERSION}_linux_arm64.tar.gz"
          curl -fsSL --retry 3 "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_arm64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$GH_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${GH_VERSION}_linux_arm64/bin" >> "$GITHUB_PATH"

      - name: Resolve eligible same-repository PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          pr_json="$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '[.[] | select(.state == "open") | select(.head.repo.full_name == .base.repo.full_name)][0]')"
          test "$pr_json" != "null" || { echo 'No eligible open same-repository PR'; exit 0; }
          pr_number="$(jq -r '.number' <<<"$pr_json")"

          checks="$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?filter=latest&per_page=100")"
          jq -e '
            (.total_count > 0) and
            all(.check_runs[];
              .status == "completed" and
              (.conclusion == "success" or .conclusion == "skipped" or .conclusion == "neutral")
            )
          ' <<<"$checks" >/dev/null

          statuses="$(gh api "repos/$REPO/commits/$HEAD_SHA/status")"
          jq -e '(.statuses | length == 0) or .state == "success"' <<<"$statuses" >/dev/null

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Merge validated PR
        if: steps.pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch
