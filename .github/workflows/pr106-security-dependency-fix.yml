name: PR106 Security Dependency Fix

on:
  push:
    branches:
      - fix/staging-runtime-project-refs

permissions:
  contents: write

concurrency:
  group: pr106-security-dependency-fix
  cancel-in-progress: false

jobs:
  update-lock:
    runs-on: [self-hosted, Linux, ARM64, solange-ci]
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: fix/staging-runtime-project-refs
          fetch-depth: 0

      - name: Use Node 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Pin patched framework dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          pkg.dependencies.next = '16.3.4'
          pkg.devDependencies['eslint-config-next'] = '16.3.4'
          pkg.overrides ??= {}
          delete pkg.overrides['next@16.2.11']
          pkg.overrides['next@16.3.4'] = {
            postcss: '8.5.26',
            sharp: '0.35.4'
          }
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n')
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit

      - name: Verify dependency security gate
        run: npm audit --audit-level=high

      - name: Verify reproducible install
        run: npm ci

      - name: Verify typecheck
        run: npm run typecheck

      - name: Verify production build
        run: npm run build

      - name: Commit lockfile update
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Solange CI Security Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes required.'
            exit 0
          fi
          git commit -m 'fix(security): upgrade Next.js past critical advisories'
          git push origin HEAD:fix/staging-runtime-project-refs
