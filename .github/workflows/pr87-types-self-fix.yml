name: PR87 types self-fix

on:
  push:
    branches: [feat-event-operations-77]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[types-fix]') }}
    runs-on: [self-hosted, Linux, ARM64, solange-ci]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat-event-operations-77
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Apply exact generated-type corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/platform/supabase/types.ts')
          text = path.read_text()
          bad_fk = 'foreignKeyName: "form_template_versions_template_id_fkey"\n            columns: ["template_version_id"]'
          good_fk = 'foreignKeyName: "form_template_versions_template_id_fkey"\n            columns: ["template_id"]'
          bad_generic = 'keyof DatabaseWithoutInternals[DefaultSchemaCompositeTypeNameOrOptions["schema"]]["CompositeTypes"]'
          good_generic = 'keyof DatabaseWithoutInternals[PublicCompositeTypeNameOrOptions["schema"]]["CompositeTypes"]'
          if text.count(bad_fk) != 1 or text.count(bad_generic) != 1:
              raise SystemExit('expected generated-type mismatch not found exactly once')
          path.write_text(text.replace(bad_fk, good_fk).replace(bad_generic, good_generic))
          PY
          npm run typecheck
          git diff --check
          git diff -- src/platform/supabase/types.ts
      - name: Commit corrected generated types
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/platform/supabase/types.ts
          git commit -m 'chore(db): correct regenerated event RPC types [types-fix]'
          git push origin HEAD:feat-event-operations-77
