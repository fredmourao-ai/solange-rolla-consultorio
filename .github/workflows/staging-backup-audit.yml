name: Staging Backup PR Validation

on:
  pull_request_target:
    paths:
      - scripts/check-managed-staging-backup.mjs
      - tests/integration/managed-staging-backup.test.ts
      - .github/workflows/staging-backup-audit.yml
      - .github/workflows/staging-managed-backup-audit.yml
      - .github/workflows/staging-promote.yml
      - scripts/ensure-staging-recovery-backup.sh
      - scripts/ensure-staging-database-credential.mjs
      - scripts/verify-staging-logical-backup-docker.sh
      - scripts/backup-verify-staging-storage.mjs
      - scripts/rotate-staging-demo-credential.mjs
      - tests/integration/staging-recovery-hardening.test.ts
      - tests/integration/staging-storage-recovery.test.ts

permissions:
  contents: read

concurrency:
  group: staging-backup-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate-pr:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - name: Install locked dependencies
        run: npm ci
      - name: Run staging recovery contracts without staging credentials
        run: >-
          npm run test:run --
          tests/integration/managed-staging-backup.test.ts
          tests/integration/staging-recovery-hardening.test.ts
          tests/integration/staging-storage-recovery.test.ts
