name: Managed Staging Backup Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '29 4 * * *'

permissions:
  contents: read

concurrency:
  group: managed-staging-backup-evidence
  cancel-in-progress: false

jobs:
  verify-provider-backups:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, solange-ci, solange-staging-host]
    environment: staging
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify managed staging database backup provenance and freshness
        env:
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -Eeuo pipefail
          python3 scripts/verify-managed-backup-evidence.py --max-age-seconds 90000
      - name: Record non-certifying result
        if: success()
        run: |
          echo 'Provider backup metadata is available; recovery, Storage, encryption custody, and restore drill remain NOT_VALIDATED.'
