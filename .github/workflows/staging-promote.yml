name: Staging Promote

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full main commit SHA already reviewed and approved for staging
        required: true
        type: string
  workflow_run:
    workflows: [CI, Database, Repository Governance Gate]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  canonical-gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, Linux, ARM64, solange-ci]
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.canonical.outputs.ready }}
      sha: ${{ steps.canonical.outputs.sha }}
    env:
      PROMOTE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit_sha }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Verify canonical main SHA and checks
        id: canonical
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const repo = process.env.GITHUB_REPOSITORY
          const sha = process.env.PROMOTE_SHA || ''
          const token = process.env.GITHUB_TOKEN
          const eventName = process.env.GITHUB_EVENT_NAME
          const output = process.env.GITHUB_OUTPUT
          const required = ['CI', 'Database', 'Repository Governance Gate']
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28',
          }
          async function get(path) {
            const response = await fetch(`https://api.github.com/repos/${repo}${path}`, { headers })
            if (!response.ok) throw new Error(`GitHub API ${response.status} for ${path}`)
            return response.json()
          }
          function emit(ready) {
            fs.appendFileSync(output, `ready=${ready}\nsha=${sha}\n`)
          }
          async function main() {
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('PROMOTE_SHA must be a full commit SHA')
            const mainRef = await get('/git/ref/heads/main')
            if (mainRef.object.sha !== sha) {
              if (eventName === 'workflow_dispatch') throw new Error(`candidate ${sha} is not current refs/heads/main ${mainRef.object.sha}`)
              emit(false)
              return
            }
            // Accept both `push` runs (a human merge that pushed main directly)
            // and `workflow_dispatch` runs (the auto-merge bot's post-merge
            // re-validation: GITHUB_TOKEN pushes never fire a `push` event,
            // see pr-auto-merge.yml). Either proves this exact SHA was
            // validated on main, which is what actually matters here.
            const acceptedEvents = ['push', 'workflow_dispatch']
            const payloads = await Promise.all(acceptedEvents.map(async (event) => {
              const query = new URLSearchParams({ head_sha: sha, event, per_page: '100' })
              return get(`/actions/runs?${query}`)
            }))
            const workflowRuns = payloads.flatMap((payload) => payload.workflow_runs)
            const notReady = []
            for (const name of required) {
              const runs = workflowRuns
                .filter((run) => run.name === name && run.head_branch === 'main')
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              const latest = runs[0]
              if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
                notReady.push(`${name}:${latest?.status ?? 'missing'}/${latest?.conclusion ?? 'none'}`)
              }
            }
            if (notReady.length) {
              if (eventName === 'workflow_dispatch') throw new Error(`canonical checks not green: ${notReady.join(', ')}`)
              console.log(`promotion not ready: ${notReady.join(', ')}`)
              emit(false)
              return
            }
            emit(true)
            console.log(`canonical staging candidate ready: ${sha}`)
          }
          main().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          NODE

  promote:
    needs: canonical-gate
    if: needs.canonical-gate.outputs.ready == 'true'
    runs-on: [self-hosted, Linux, ARM64, solange-ci, solange-staging-host]
    environment: staging
    timeout-minutes: 45
    env:
      PROMOTE_SHA: ${{ needs.canonical-gate.outputs.sha }}
      STAGING_DEPLOY_ROOT: /home/ubuntu/solange-client-demo
    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PROMOTE_SHA }}
          fetch-depth: 0

      - name: Verify selected revision
        run: |
          set -Eeuo pipefail
          test -n "$PROMOTE_SHA"
          test "$(git rev-parse HEAD)" = "$PROMOTE_SHA"
          test "$(git rev-parse origin/main)" = "$PROMOTE_SHA"

      - name: Isolate npm cache per runner
        shell: bash
        run: echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"

      - name: Use Node 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify synthetic seed
        run: npm run seed:check

      - name: Validate serialized staging promotion
        env:
          APP_ENV: staging
          STAGING_COMMIT_SHA: ${{ env.PROMOTE_SHA }}
          STAGING_PROMOTION_APPROVED: ${{ vars.STAGING_PROMOTION_APPROVED }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WHATSAPP_LIVE_ENABLED: ${{ vars.WHATSAPP_LIVE_ENABLED }}
          EMAIL_LIVE_ENABLED: ${{ vars.EMAIL_LIVE_ENABLED }}
          NFSE_LIVE_ENABLED: ${{ vars.NFSE_LIVE_ENABLED }}
        run: |
          npm run environment:check
          node scripts/staging-lock.mjs

      - name: Apply forward migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        run: node scripts/apply-staging-migrations.mjs

      - name: Verify staging accounting RLS
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        run: node scripts/verify-staging-accounting-rls.mjs

      - name: Seed synthetic staging fixtures
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF }}
        run: node scripts/seed-staging-project.mjs

      - name: Deploy exact SHA to homologation
        shell: bash
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_PRODUCTION_PROJECT_REF: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_REF }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WHATSAPP_LIVE_ENABLED: ${{ vars.WHATSAPP_LIVE_ENABLED }}
          EMAIL_LIVE_ENABLED: ${{ vars.EMAIL_LIVE_ENABLED }}
          NFSE_LIVE_ENABLED: ${{ vars.NFSE_LIVE_ENABLED }}
        run: |
          set -Eeuo pipefail
          ROOT="$STAGING_DEPLOY_ROOT"
          APP="$ROOT/app"
          STAGE="$ROOT/app-stage-$PROMOTE_SHA"
          PREVIOUS="$ROOT/app-previous"
          RUNTIME_ENV="$ROOT/staging.env"
          CANDIDATE_STATE="$ROOT/state/candidate-$PROMOTE_SHA"
          WEB=solange-client-demo-web
          DOC=solange-document-worker
          MSG=solange-messaging-worker
          REC=solange-recurring-payables-worker
          RECONCILER=solange-demo-reconciler
          TUNNEL=solange-demo-tunnel
          RECONCILER_PREVIOUS="$ROOT/reconcile-previous.sh"
          STAGING_DB_CONTAINER=supabase_db_solange-client-demo
          TRANSACTION="$ROOT/state/deploy-transaction-$PROMOTE_SHA"
          APP_SWAPPED=0
          WEB_SWAPPED=0
          WORKERS_SWAPPED=0
          REC_SWAPPED=0
          SHA_SWAPPED=0
          RECONCILER_SWAPPED=0

          # docker run without --user leaves root-owned files behind (see below); a plain
          # `rm -rf` as the non-root runner user then can't remove them. Retry with sudo -n
          # before giving up, instead of leaving unremovable debris for the next promotion.
          force_rm() {
            rm -rf "$@" 2>/dev/null && return 0
            sudo -n rm -rf "$@"
          }

          cleanup_stage() {
            force_rm "$STAGE"
          }
          rollback() {
            rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ]; then
              docker rm -f "${DOC}-candidate" "${MSG}-candidate" "${REC}-candidate" >/dev/null 2>&1 || true
              if [ "$WORKERS_SWAPPED" -eq 1 ]; then
                if docker inspect "${DOC}-previous" >/dev/null 2>&1; then
                  docker rm -f "$DOC" >/dev/null 2>&1 || true
                  docker rename "${DOC}-previous" "$DOC" || true
                  docker start "$DOC" >/dev/null 2>&1 || true
                fi
                if docker inspect "${MSG}-previous" >/dev/null 2>&1; then
                  docker rm -f "$MSG" >/dev/null 2>&1 || true
                  docker rename "${MSG}-previous" "$MSG" || true
                  docker start "$MSG" >/dev/null 2>&1 || true
                fi
                if docker inspect "${REC}-previous" >/dev/null 2>&1; then
                  docker rm -f "$REC" >/dev/null 2>&1 || true
                  docker rename "${REC}-previous" "$REC" || true
                  docker start "$REC" >/dev/null 2>&1 || true
                elif [ "$REC_SWAPPED" -eq 1 ]; then
                  docker rm -f "$REC" >/dev/null 2>&1 || true
                fi
              fi
              if [ "$APP_SWAPPED" -eq 1 ] && [ -d "$PREVIOUS" ]; then
                docker rm -f "$WEB" >/dev/null 2>&1 || true
                force_rm "$APP"
                mv "$PREVIOUS" "$APP"
              fi
              if [ "$WEB_SWAPPED" -eq 1 ] && docker inspect "${WEB}-previous" >/dev/null 2>&1; then
                docker rm -f "$WEB" >/dev/null 2>&1 || true
                docker rename "${WEB}-previous" "$WEB" || true
                docker start "$WEB" >/dev/null 2>&1 || true
              fi
              if [ "$SHA_SWAPPED" -eq 1 ] && [ -f "$ROOT/state/previous-deployed-sha.txt" ]; then
                mv "$ROOT/state/previous-deployed-sha.txt" "$ROOT/state/deployed-sha.txt"
              fi
              if [ "$RECONCILER_SWAPPED" -eq 1 ] && [ -f "$RECONCILER_PREVIOUS" ]; then
                mv "$RECONCILER_PREVIOUS" "$ROOT/reconcile.sh"
                docker restart "$RECONCILER" >/dev/null 2>&1 || true
              else
                rm -f "$RECONCILER_PREVIOUS"
              fi
              rm -f "$TRANSACTION"
            fi
            cleanup_stage
            exit "$rc"
          }
          trap rollback EXIT

          test -d "$ROOT/state"
          test -f "$ROOT/demo.env"
          test "$(stat -c '%a' "$ROOT/demo.env")" = 600
          test -f "$ROOT/reconcile.sh"
          rm -f "$TRANSACTION" "$RECONCILER_PREVIOUS"
          cp -p "$ROOT/reconcile.sh" "$RECONCILER_PREVIOUS"
          mkdir -p "$ROOT/backups"
          chmod 700 "$ROOT/backups"
          SOLANGE_BACKUP_DEST="$ROOT/backups" scripts/backup-homologation.sh

          force_rm "$STAGE" "$PREVIOUS" "$CANDIDATE_STATE"
          mkdir -p "$STAGE" "$CANDIDATE_STATE/document" "$CANDIDATE_STATE/messaging" "$CANDIDATE_STATE/recurring"
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.env.production.local' \
            "$GITHUB_WORKSPACE/" "$STAGE/"

          python3 - "$ROOT/demo.env" "$RUNTIME_ENV" "$PROMOTE_SHA" "$ROOT/state/current-url.txt" <<'PY'
          import os, pathlib, sys
          from urllib.parse import urlsplit
          source = pathlib.Path(sys.argv[1])
          target = pathlib.Path(sys.argv[2])
          sha = sys.argv[3]
          app_url = pathlib.Path(sys.argv[4]).read_text().strip().rstrip('/')
          parsed_app_url = urlsplit(app_url)
          if parsed_app_url.scheme not in {'http', 'https'} or not parsed_app_url.netloc:
              raise SystemExit('current staging URL is invalid')
          values = {}
          for raw in source.read_text().splitlines():
              line = raw.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              values[key] = value
          overrides = {
              'APP_ENV': 'staging',
              'APP_URL': app_url,
              'APP_BUILD_SHA': sha,
              'STAGING_COMMIT_SHA': sha,
              'SUPABASE_PROJECT_REF': os.environ['SUPABASE_PROJECT_REF'],
              'SUPABASE_STAGING_PROJECT_REF': os.environ['SUPABASE_STAGING_PROJECT_REF'],
              'SUPABASE_PRODUCTION_PROJECT_REF': os.environ['SUPABASE_PRODUCTION_PROJECT_REF'],
              'NEXT_PUBLIC_SUPABASE_URL': os.environ['NEXT_PUBLIC_SUPABASE_URL'],
              'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY': os.environ['NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY'],
              'SUPABASE_SECRET_KEY': os.environ['SUPABASE_SECRET_KEY'],
              'WHATSAPP_LIVE_ENABLED': os.environ.get('WHATSAPP_LIVE_ENABLED') or 'false',
              'EMAIL_LIVE_ENABLED': os.environ.get('EMAIL_LIVE_ENABLED') or 'false',
              'NFSE_LIVE_ENABLED': os.environ.get('NFSE_LIVE_ENABLED') or 'false',
          }
          for key, value in overrides.items():
              if key in {
                  'SUPABASE_PROJECT_REF',
                  'SUPABASE_STAGING_PROJECT_REF',
                  'SUPABASE_PRODUCTION_PROJECT_REF',
                  'NEXT_PUBLIC_SUPABASE_URL',
                  'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY',
                  'SUPABASE_SECRET_KEY',
              } and not value:
                  raise SystemExit(f'missing validated staging value for {key}')
              values[key] = value
          target.write_text(''.join(f'{key}={value}\n' for key, value in values.items()))
          target.chmod(0o600)
          PY
          install -m 600 "$RUNTIME_ENV" "$STAGE/.env.production.local"
          install -m 755 "$GITHUB_WORKSPACE/ops/staging/reconcile-demo.sh" "$ROOT/reconcile.sh"
          RECONCILER_SWAPPED=1

          python3 - "$STAGE/.env.production.local" "$GITHUB_WORKSPACE" <<'PY'
          import os, pathlib, subprocess, sys
          env = os.environ.copy()
          for raw in pathlib.Path(sys.argv[1]).read_text().splitlines():
              if not raw or raw.startswith('#') or '=' not in raw:
                  continue
              key, value = raw.split('=', 1)
              env[key] = value
          subprocess.run(['npm', 'run', 'environment:check'], cwd=sys.argv[2], env=env, check=True)
          PY

          read -r DB_HOST DB_PORT DB_USER < <(python3 - "$RUNTIME_ENV" <<'PY'
          import pathlib, sys
          from urllib.parse import urlsplit
          values = {}
          for raw in pathlib.Path(sys.argv[1]).read_text().splitlines():
              if raw and not raw.startswith('#') and '=' in raw:
                  key, value = raw.split('=', 1)
                  values[key] = value
          parsed = urlsplit(values.get('DB_URL', ''))
          if not parsed.hostname:
              raise SystemExit('DB_URL missing host for staging readiness check')
          print(parsed.hostname, parsed.port or 5432, parsed.username or 'postgres')
          PY
          )
          if [ "$DB_HOST" = 127.0.0.1 ] || [ "$DB_HOST" = localhost ]; then
            if ! pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" >/dev/null 2>&1; then
              echo "staging database endpoint unavailable; repairing Docker publication" >&2
              docker inspect "$STAGING_DB_CONTAINER" >/dev/null
              docker restart -t 30 "$STAGING_DB_CONTAINER" >/dev/null
              ready=0
              for _ in $(seq 1 30); do
                if pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" >/dev/null 2>&1; then
                  ready=1
                  break
                fi
                sleep 1
              done
              if [ "$ready" -ne 1 ]; then
                echo "staging database endpoint unavailable after repair" >&2
                exit 1
              fi
            fi
          fi

          python3 - "$RUNTIME_ENV" <<'PY'
          import pathlib, subprocess, sys
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit
          values = {}
          for raw in pathlib.Path(sys.argv[1]).read_text().splitlines():
              if raw and not raw.startswith('#') and '=' in raw:
                  key, value = raw.split('=', 1)
                  values[key] = value
          db_url = values.get('DB_URL')
          if not db_url:
              raise SystemExit('DB_URL missing from staging runtime env')
          parsed = urlsplit(db_url)
          if parsed.hostname in {'127.0.0.1', 'localhost'}:
              query = dict(parse_qsl(parsed.query, keep_blank_values=True))
              query['sslmode'] = 'disable'
              db_url = urlunsplit((parsed.scheme, parsed.netloc, parsed.path, urlencode(query), parsed.fragment))
          result = subprocess.run(['npx', 'supabase@2.118.0', 'db', 'push', '--db-url', db_url, '--include-all', '--yes'])
          if result.returncode:
              print('staging migration push failed', file=sys.stderr)
              raise SystemExit(result.returncode)
          PY

          docker run --rm --network host --user "$(id -u):$(id -g)" -e HOME=/tmp -e npm_config_cache=/tmp/.npm -v "$STAGE:/app" -w /app node:24-bookworm-slim npm ci
          docker run --rm --network host --user "$(id -u):$(id -g)" -e HOME=/tmp -e npm_config_cache=/tmp/.npm -v "$STAGE:/app" -w /app node:24-bookworm-slim npm run build
          test -f "$STAGE/package.json"
          test -f "$STAGE/.env.production.local"
          test -s "$STAGE/.next/BUILD_ID"

          ROOT="$GITHUB_WORKSPACE" DEMO="$STAGING_DEPLOY_ROOT" ENV_FILE="$RUNTIME_ENV" \
            IMAGE="solange-document-worker:$PROMOTE_SHA" CONTAINER="${DOC}-candidate" \
            STATE_DIR="$CANDIDATE_STATE/document" bash ops/document-worker/run-demo-worker.sh
          ROOT="$GITHUB_WORKSPACE" DEMO="$STAGING_DEPLOY_ROOT" ENV_FILE="$RUNTIME_ENV" \
            IMAGE="solange-messaging-worker:$PROMOTE_SHA" CONTAINER="${MSG}-candidate" \
            STATE_DIR="$CANDIDATE_STATE/messaging" bash ops/messaging-worker/run-demo-worker.sh
          ROOT="$GITHUB_WORKSPACE" DEMO="$STAGING_DEPLOY_ROOT" ENV_FILE="$RUNTIME_ENV" \
            IMAGE="solange-recurring-payables-worker:$PROMOTE_SHA" CONTAINER="${REC}-candidate" \
            STATE_DIR="$CANDIDATE_STATE/recurring" bash ops/recurring-payables-worker/run-demo-worker.sh

          docker stop "$WEB" >/dev/null
          docker rm -f "${WEB}-previous" >/dev/null 2>&1 || true
          docker rename "$WEB" "${WEB}-previous"
          WEB_SWAPPED=1
          mv "$APP" "$PREVIOUS"
          APP_SWAPPED=1
          mv "$STAGE" "$APP"
          docker run -d --name "$WEB" --restart unless-stopped --network host \
            --env-file "$RUNTIME_ENV" \
            -v "$APP:/app" \
            -w /app \
            node:24-bookworm-slim npm run start -- --hostname 127.0.0.1 --port 3200 >/dev/null
          docker update --restart unless-stopped "$RECONCILER" "$TUNNEL" >/dev/null
          docker restart "$RECONCILER" >/dev/null

          docker rm -f "${DOC}-previous" "${MSG}-previous" "${REC}-previous" >/dev/null 2>&1 || true
          WORKERS_SWAPPED=1
          if docker inspect "$DOC" >/dev/null 2>&1; then docker rename "$DOC" "${DOC}-previous"; fi
          if docker inspect "$MSG" >/dev/null 2>&1; then docker rename "$MSG" "${MSG}-previous"; fi
          if docker inspect "$REC" >/dev/null 2>&1; then docker rename "$REC" "${REC}-previous"; fi
          docker rename "${DOC}-candidate" "$DOC"
          docker rename "${MSG}-candidate" "$MSG"
          docker rename "${REC}-candidate" "$REC"
          REC_SWAPPED=1
          test "$(docker inspect -f '{{.State.Status}}' "$DOC")" = running
          test "$(docker inspect -f '{{.State.Status}}' "$MSG")" = running
          test "$(docker inspect -f '{{.State.Status}}' "$REC")" = running
          test -s "$CANDIDATE_STATE/document/document-worker.heartbeat"
          test -s "$CANDIDATE_STATE/messaging/messaging-worker.heartbeat"
          test -s "$CANDIDATE_STATE/recurring/recurring-payables-worker.heartbeat"
          if [ -f "$ROOT/state/deployed-sha.txt" ]; then
            cp "$ROOT/state/deployed-sha.txt" "$ROOT/state/previous-deployed-sha.txt"
          else
            rm -f "$ROOT/state/previous-deployed-sha.txt"
          fi
          printf '%s\n' "$PROMOTE_SHA" > "$ROOT/state/deployed-sha.txt"
          SHA_SWAPPED=1
          printf '%s\n' "$PROMOTE_SHA" > "$TRANSACTION"

      - name: Verify deployed SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$STAGING_DEPLOY_ROOT"
          test "$(cat "$ROOT/state/deployed-sha.txt")" = "$PROMOTE_SHA"
          URL=$(cat "$ROOT/state/current-url.txt")
          actual=''
          for _ in $(seq 1 30); do
            payload=$(curl --fail --silent --show-error "$URL/api/health" || true)
            actual=$(printf '%s' "$payload" | jq -r '.buildSha // empty' 2>/dev/null || true)
            [ "$actual" = "$PROMOTE_SHA" ] && break
            sleep 2
          done
          test "$actual" = "$PROMOTE_SHA"
          test "$(sed -n 's/^APP_URL=//p' "$ROOT/app/.env.production.local" | tail -1)" = "$URL"
          test "$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' solange-client-demo-web)" = unless-stopped
          test "$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' solange-demo-reconciler)" = unless-stopped
          test "$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' solange-demo-tunnel)" = unless-stopped
          test "$(docker inspect -f '{{.State.Status}}' solange-demo-reconciler)" = running
          case "$(sed -n 's/^NEXT_PUBLIC_SUPABASE_URL=//p' "$ROOT/app/.env.production.local" | tail -1)" in
            *.trycloudflare.com*) echo 'Supabase URL must not point at the staging tunnel' >&2; exit 1 ;;
          esac
          # Previous release resources remain available until browser-driven
          # staging homologation succeeds, so a failed acceptance run can roll back.

      - name: Staging app smoke contract
        if: vars.STAGING_APP_URL != ''
        env:
          STAGING_APP_URL: ${{ vars.STAGING_APP_URL }}
        run: |
          payload=$(curl --fail --silent --show-error --retry 3 "$STAGING_APP_URL/api/health")
          test "$(printf '%s' "$payload" | jq -r '.buildSha')" = "$PROMOTE_SHA"

      - name: Install Playwright browser for staging acceptance
        run: npx playwright install chromium

      - name: Real UI staging homologation
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        run: |
          set -Eeuo pipefail
          python3 - "$STAGING_DEPLOY_ROOT/staging.env" "$STAGING_DEPLOY_ROOT/state/current-url.txt" "$PROMOTE_SHA" <<'PY'
          import os, pathlib, subprocess, sys
          env_file = pathlib.Path(sys.argv[1])
          app_url = pathlib.Path(sys.argv[2]).read_text().strip().rstrip('/')
          sha = sys.argv[3]
          values = {}
          for raw in env_file.read_text().splitlines():
              if raw and not raw.startswith('#') and '=' in raw:
                  key, value = raw.split('=', 1)
                  values[key] = value
          required = ['DEMO_LOCAL_EMAIL', 'DEMO_LOCAL_PASSWORD', 'NEXT_PUBLIC_SUPABASE_URL', 'SUPABASE_SECRET_KEY', 'SUPABASE_PROJECT_REF']
          missing = [key for key in required if not values.get(key)]
          if missing:
              raise SystemExit(f'missing staging E2E values: {", ".join(missing)}')
          if not app_url:
              raise SystemExit('staging current URL is empty')
          child = os.environ.copy()
          child.update(values)
          child.update({
              'APP_ENV': 'staging',
              'E2E_TARGET_ENV': 'staging',
              'APP_URL': app_url,
              'E2E_BASE_URL': app_url,
              'E2E_ALLOWED_BASE_URL': app_url,
              'E2E_DB_MODE': 'supabase-management-api',
              'SUPABASE_STAGING_PROJECT_REF': os.environ['SUPABASE_STAGING_PROJECT_REF'],
              'SUPABASE_ACCESS_TOKEN': os.environ['SUPABASE_ACCESS_TOKEN'],
              'E2E_EXPECTED_BUILD_SHA': sha,
          })
          subprocess.run(
              ['npx', 'playwright', 'test', 'tests/e2e/real-ui-homologation.spec.ts', '--project=chromium'],
              env=child,
              check=True,
          )
          PY

      - name: Refresh durable backup scheduler
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$GITHUB_WORKSPACE" DEMO="$STAGING_DEPLOY_ROOT" bash ops/backup/run-demo-scheduler.sh

      - name: Rollback staging release after failed validation
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$STAGING_DEPLOY_ROOT"
          APP="$ROOT/app"
          PREVIOUS="$ROOT/app-previous"
          WEB=solange-client-demo-web
          DOC=solange-document-worker
          MSG=solange-messaging-worker
          REC=solange-recurring-payables-worker
          RECONCILER=solange-demo-reconciler
          RECONCILER_PREVIOUS="$ROOT/reconcile-previous.sh"
          TRANSACTION="$ROOT/state/deploy-transaction-$PROMOTE_SHA"
          [ -f "$TRANSACTION" ] || exit 0
          force_rm() {
            rm -rf "$@" 2>/dev/null && return 0
            sudo -n rm -rf "$@"
          }
          if [ -d "$PREVIOUS" ]; then
            docker rm -f "$WEB" >/dev/null 2>&1 || true
            force_rm "$APP"
            mv "$PREVIOUS" "$APP"
          fi
          if docker inspect "${WEB}-previous" >/dev/null 2>&1; then
            docker rm -f "$WEB" >/dev/null 2>&1 || true
            docker rename "${WEB}-previous" "$WEB"
            docker start "$WEB" >/dev/null 2>&1 || true
          fi
          if [ -f "$RECONCILER_PREVIOUS" ]; then
            mv "$RECONCILER_PREVIOUS" "$ROOT/reconcile.sh"
          fi
          docker restart "$RECONCILER" >/dev/null 2>&1 || true
          if docker inspect "${DOC}-previous" >/dev/null 2>&1; then
            docker rm -f "$DOC" >/dev/null 2>&1 || true
            docker rename "${DOC}-previous" "$DOC"
            docker start "$DOC" >/dev/null 2>&1 || true
          fi
          if docker inspect "${MSG}-previous" >/dev/null 2>&1; then
            docker rm -f "$MSG" >/dev/null 2>&1 || true
            docker rename "${MSG}-previous" "$MSG"
            docker start "$MSG" >/dev/null 2>&1 || true
          fi
          if docker inspect "${REC}-previous" >/dev/null 2>&1; then
            docker rm -f "$REC" >/dev/null 2>&1 || true
            docker rename "${REC}-previous" "$REC"
            docker start "$REC" >/dev/null 2>&1 || true
          else
            docker rm -f "$REC" >/dev/null 2>&1 || true
          fi
          if [ -f "$ROOT/state/previous-deployed-sha.txt" ]; then
            mv "$ROOT/state/previous-deployed-sha.txt" "$ROOT/state/deployed-sha.txt"
          fi
          force_rm "$ROOT/state/candidate-$PROMOTE_SHA"
          rm -f "$TRANSACTION"

      - name: Finalize promoted release
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$STAGING_DEPLOY_ROOT"
          TRANSACTION="$ROOT/state/deploy-transaction-$PROMOTE_SHA"
          docker rm -f solange-client-demo-web-previous solange-document-worker-previous solange-messaging-worker-previous solange-recurring-payables-worker-previous >/dev/null 2>&1 || true
          rm -rf "$ROOT/app-previous" 2>/dev/null || sudo -n rm -rf "$ROOT/app-previous"
          rm -f "$ROOT/state/previous-deployed-sha.txt" "$TRANSACTION"
          rm -f "$ROOT/reconcile-previous.sh"
          # Keep the promoted release state directory: the canonical workers bind-mount it
          # and need the same host path to exist after container restarts.
