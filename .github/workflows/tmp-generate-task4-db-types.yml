name: Temporary Task4 DB Types

on:
  push:
    branches:
      - feat/users-access-admin-20260911

permissions:
  contents: write

concurrency:
  group: tmp-task4-db-types
  cancel-in-progress: true

jobs:
  generate:
    runs-on: [self-hosted, Linux, ARM64, solange-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npx supabase@2.115.0 db start
      - run: npx supabase@2.115.0 db reset
      - name: Generate and commit exact database types
        shell: bash
        run: |
          set -euo pipefail
          npx supabase@2.115.0 gen types typescript --local > src/platform/supabase/types.ts
          rm .github/workflows/tmp-generate-task4-db-types.yml
          git config user.name "Solange CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/platform/supabase/types.ts .github/workflows/tmp-generate-task4-db-types.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh database types for access administration"
          git push origin HEAD:feat/users-access-admin-20260911
